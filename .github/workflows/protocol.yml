name: C++ protocol verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU evaluation dependencies
        run: python -m pip install -r scripts/requirements-eval.lock.txt
      - name: Verify standalone MOT17 and PP22 evaluation
        run: python tests/evaluation_tools_tests.py
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # The pinned GCC 16.2.0 (scripts/build_gcc.sh) is not installed on hosted runners.
        run: cmake -S . -B build/cpu -DCMAKE_BUILD_TYPE=Release -DSACCADE_ALLOW_UNPINNED_COMPILER=ON
      - name: Build
        run: cmake --build build/cpu --parallel 2
      - name: Verify protocol, checked I/O, config, model manifest (schema 1, 2 and 3), selective-scan reference, head weight delivery and head reference contracts
        run: ctest --test-dir build/cpu --output-on-failure

<title id="title">F03 模型架構｜HR 三尺度 spatial head</title>
<desc id="desc">固定基準 3cbaa518f0dc。FP32 影像輸入經 YOLO26m backbone/neck 與三尺度 Mamba spatial head，輸出六個 FP32 raw tensors。TensorRT 使用 FP16 tactics，scan plugins 維持 FP32；T=1，每次 scan 零初始狀態。</desc>

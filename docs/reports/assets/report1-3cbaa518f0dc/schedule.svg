<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">Saccade v1｜執行順序與交付邊界</title>
<desc id="desc">基準 3cbaa518f0dc 的概念時序圖：D 偵測與 M 運動估計同幀重疊，候選完成後才擷取 mask 並執行 tracking tail，成功 commit 後兩次 D2H 再 receive。所有寬度僅表示依賴順序，不表示量測延遲。</desc>
<defs><marker id="arrow-0F8B8D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F8B8D"/></marker><marker id="arrow-2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker><marker id="arrow-4F46E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/></marker><marker id="arrow-DCE3ED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DCE3ED"/></marker></defs>
<g font-family="Noto Sans CJK TC, Noto Sans, sans-serif">
<rect x="0" y="0" width="1600" height="1150" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<text x="64" y="42" font-size="16" font-weight="700" fill="#2563EB" text-anchor="start">SACCADE V1  /  FIGURE 03</text>
<text x="64" y="90" font-size="36" font-weight="700" fill="#17263C" text-anchor="start">執行順序與交付邊界</text>
<text x="64" y="128" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">以 ready／consumed 事件連接雙 stream；同幀運動估計與偵測可重疊。</text>
<text x="1536" y="44" font-size="16" font-weight="500" fill="#64748B" text-anchor="end">BASELINE  3cbaa518f0dc</text>
<rect x="1178" y="69" width="358" height="45" rx="22" fill="#EAF0FB" stroke="none" stroke-width="1"/>
<text x="1357" y="99" font-size="18" font-weight="600" fill="#2563EB" text-anchor="middle">依賴示意，非量測時間比例</text>
<rect x="64" y="156" width="10" height="10" rx="3" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="85" y="167" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">D：偵測</text>
<rect x="234" y="156" width="10" height="10" rx="3" fill="#0F8B8D" stroke="none" stroke-width="1"/>
<text x="255" y="167" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">M：有序狀態更新</text>
<rect x="514" y="156" width="10" height="10" rx="3" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="535" y="167" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">Host：提交與交付</text>
<rect x="48" y="196" width="1504" height="654" rx="24" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1"/>
<text x="274" y="232" font-size="17" font-weight="600" fill="#64748B" text-anchor="start">時間順序</text>
<path d="M 370 226 L 1480 226" fill="none" stroke="#DCE3ED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-DCE3ED)"/>
<rect x="64" y="250" width="1472" height="104" rx="14" fill="#F5F3FF" stroke="none" stroke-width="1"/>
<rect x="64" y="366" width="1472" height="142" rx="14" fill="#EFF5FF" stroke="none" stroke-width="1"/>
<rect x="64" y="548" width="1472" height="142" rx="14" fill="#EDF9F7" stroke="none" stroke-width="1"/>
<rect x="64" y="730" width="1472" height="96" rx="14" fill="#F5F3FF" stroke="none" stroke-width="1"/>
<text x="88" y="287" font-size="22" font-weight="700" fill="#4F46E5" text-anchor="start">CPU caller</text>
<text x="88" y="319" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">提交與輸入控制</text>
<text x="88" y="413" font-size="22" font-weight="700" fill="#2563EB" text-anchor="start">Detect · D</text>
<text x="88" y="445" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">F01–F05 / D Graph</text>
<text x="88" y="595" font-size="22" font-weight="700" fill="#0F8B8D" text-anchor="start">Main · M</text>
<text x="88" y="627" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">依 frame 有序</text>
<text x="88" y="768" font-size="22" font-weight="700" fill="#4F46E5" text-anchor="start">Host result</text>
<text x="88" y="799" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">接收與後處理</text>
<path d="M 390 338 V 386" fill="none" stroke="#4F46E5" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4F46E5)"/>
<path d="M 445 437 L 465 437" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-2563EB)"/>

<path d="M 1005 619 L 1120 619" fill="none" stroke="#0F8B8D" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-0F8B8D)"/>
<path d="M 1225 619 L 1245 619" fill="none" stroke="#0F8B8D" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-0F8B8D)"/>
<path d="M 1362 674 V 744" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-4F46E5)"/>
<rect x="270" y="266" width="240" height="72" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
<rect x="270" y="266" width="5" height="72" rx="2" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="390.0" y="297" font-size="20" font-weight="700" fill="#4F46E5" text-anchor="middle">enqueue(k)</text>
<text x="390.0" y="326" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">JPEG bytes / staging</text>
<text x="566" y="286" font-size="18" font-weight="500" fill="#17263C" text-anchor="start">下一次 JPEG decode 前，host 等 rgb_read_done</text>
<text x="566" y="318" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">原圖 RGB 的最後 F02／F05 reader 完成後才可重用。</text>
<rect x="270" y="386" width="175" height="106" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="270" y="386" width="5" height="106" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="357.5" y="417" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">F01 / F02</text>
<text x="357.5" y="446" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">decode · resize</text>
<text x="357.5" y="471" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">GPU RGB → images</text>
<rect x="465" y="386" width="110" height="106" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="465" y="386" width="5" height="106" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="520.0" y="417" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">F05</text>
<text x="520.0" y="446" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">灰階 MI</text>
<text x="520.0" y="471" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">獨立 slot</text>
<rect x="600" y="386" width="290" height="106" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="600" y="386" width="5" height="106" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="745.0" y="417" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">F03 · TensorRT</text>
<text x="745.0" y="446" font-size="18" font-weight="400" fill="#17263C" text-anchor="middle">YOLO26m + scan head</text>
<text x="745.0" y="471" font-size="18" font-weight="400" fill="#17263C" text-anchor="middle">D Graph</text>
<rect x="910" y="386" width="210" height="106" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="910" y="386" width="5" height="106" rx="2" fill="#2563EB" stroke="none" stroke-width="1"/>
<text x="1015.0" y="417" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">producer → F04</text>
<text x="1015.0" y="446" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">finite checks · NMS</text>
<text x="1015.0" y="471" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">D Graph</text>
<rect x="1150" y="386" width="330" height="106" rx="12" fill="#E4EDFF" stroke="#B2C9F5" stroke-width="1"/>
<text x="1315" y="419" font-size="20" font-weight="700" fill="#2563EB" text-anchor="middle">D(k+1) 可開始</text>
<text x="1315" y="449" font-size="17" font-weight="400" fill="#2563EB" text-anchor="middle">與 M(k) tracking tail 重疊</text>
<text x="1315" y="475" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle">依各 slot 的 consumed 保護重用</text>
<rect x="604" y="510" width="104" height="27" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="616" y="529" font-size="17" font-weight="600" fill="#0F8B8D" text-anchor="start">mi_ready(k)</text>
<rect x="958" y="510" width="219" height="27" rx="8" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="970" y="529" font-size="17" font-weight="600" fill="#2563EB" text-anchor="start">candidates_ready(k)</text>
<rect x="600" y="568" width="205" height="106" rx="12" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="1.4"/>
<rect x="600" y="568" width="5" height="106" rx="2" fill="#0F8B8D" stroke="none" stroke-width="1"/>
<text x="702.5" y="599" font-size="20" font-weight="700" fill="#0F8B8D" text-anchor="middle">F06 · G1</text>
<text x="702.5" y="628" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">NVOFA → median</text>
<text x="702.5" y="653" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">previous gray / mask</text>
<rect x="825" y="568" width="180" height="106" rx="12" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="1.4"/>
<rect x="825" y="568" width="5" height="106" rx="2" fill="#0F8B8D" stroke="none" stroke-width="1"/>
<text x="915.0" y="599" font-size="20" font-weight="700" fill="#0F8B8D" text-anchor="middle">F08a</text>
<text x="915.0" y="628" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">GMC control</text>
<text x="915.0" y="653" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">一次 Kalman predict</text>
<text x="1060" y="597" font-size="17" font-weight="400" fill="#64748B" text-anchor="middle">候選等待</text>
<rect x="1120" y="568" width="105" height="106" rx="12" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="1.4"/>
<rect x="1120" y="568" width="5" height="106" rx="2" fill="#0F8B8D" stroke="none" stroke-width="1"/>
<text x="1172.5" y="599" font-size="20" font-weight="700" fill="#0F8B8D" text-anchor="middle">Mask(k)</text>
<text x="1172.5" y="628" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">本幀遮罩</text>
<text x="1172.5" y="653" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">供下幀用</text>
<rect x="1245" y="568" width="235" height="106" rx="12" fill="#FFFFFF" stroke="#0F8B8D" stroke-width="1.4"/>
<rect x="1245" y="568" width="5" height="106" rx="2" fill="#0F8B8D" stroke="none" stroke-width="1"/>
<text x="1362.5" y="599" font-size="20" font-weight="700" fill="#0F8B8D" text-anchor="middle">M tracking tail</text>
<text x="1362.5" y="628" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">F04b → F07 / F08b</text>
<text x="1362.5" y="653" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">commit → packet</text>
<rect x="1245" y="744" width="235" height="70" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
<rect x="1245" y="744" width="5" height="70" rx="2" fill="#4F46E5" stroke="none" stroke-width="1"/>
<text x="1362.5" y="775" font-size="20" font-weight="700" fill="#4F46E5" text-anchor="middle">D2H → receive(k)</text>
<text x="1362.5" y="804" font-size="17" font-weight="400" fill="#17263C" text-anchor="middle">56 B + 12,368 B</text>
<text x="288" y="767" font-size="18" font-weight="500" fill="#17263C" text-anchor="start">成功 commit 同時發布 TrackState、gray 與 mask 的新版本。</text>
<text x="288" y="799" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">M tail 之後依序複製 MotionContext、ResultPacket；完成事件之後 host 才讀取。</text>
<rect x="64" y="878" width="464" height="168" rx="18" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1"/>
<text x="88" y="916" font-size="17" font-weight="700" fill="#2563EB" text-anchor="start">01</text>
<text x="129" y="916" font-size="22" font-weight="700" fill="#17263C" text-anchor="start">同幀重疊</text>
<text x="88" y="954" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">F05 發布獨立 MI 後，M 上的 F06／predict</text>
<text x="88" y="983" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">可與 D 上的 F03／F04 同時執行。</text>
<text x="88" y="1012" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">OFA 是固定功能引擎，前後處理仍使用 CUDA。</text>
<rect x="568" y="878" width="464" height="168" rx="18" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1"/>
<text x="592" y="916" font-size="17" font-weight="700" fill="#0F8B8D" text-anchor="start">02</text>
<text x="633" y="916" font-size="22" font-weight="700" fill="#17263C" text-anchor="start">有限 slot 的交接</text>
<text x="592" y="954" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">MI 與 candidates 各有 ready／consumed。</text>
<text x="592" y="983" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">M 完成最後讀取後發布 consumed，D 才重用。</text>
<text x="592" y="1012" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">結果 ring 滿時，以背壓保留待接收結果。</text>
<rect x="1072" y="878" width="464" height="168" rx="18" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1"/>
<text x="1096" y="916" font-size="17" font-weight="700" fill="#4F46E5" text-anchor="start">03</text>
<text x="1137" y="916" font-size="22" font-weight="700" fill="#17263C" text-anchor="start">跨幀狀態邊界</text>
<text x="1096" y="954" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">D(k+1) 可與 M(k) 的 tracking tail 重疊。</text>
<text x="1096" y="983" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">M(k+1) 不得越過 commit(k)。</text>
<text x="1096" y="1012" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">失敗不發布 working state；首次錯誤保留。</text>
<path d="M 64 1082 L 1536 1082" fill="none" stroke="#DCE3ED" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64" y="1116" font-size="17" font-weight="400" fill="#64748B" text-anchor="start">G1 / v1-motion/2   ·   HR 1280×768   ·   CUDA Graph ON</text>
<text x="1536" y="1116" font-size="17" font-weight="400" fill="#64748B" text-anchor="end">來源：TrackingSession 實作；區塊寬度不代表延遲或硬體利用率。</text>
</g>

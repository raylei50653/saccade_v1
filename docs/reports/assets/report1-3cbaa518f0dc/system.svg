<title id="title">Saccade v1：原生 GPU 追蹤系統架構</title>
<desc id="desc">固定基準3cbaa518f0dc。JPEG輸入經D偵測與M追蹤兩條stream；G1 NVOFA使用上一提交的gray和mask；成功提交後輸出MotionContext和ResultPacket。</desc>

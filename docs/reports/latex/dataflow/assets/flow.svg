<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc"><title id="title">一幀進來，分成偵測與運動兩條資料路徑</title><desc id="desc">Current HR/G1 JPEG dataflow; blocks represent responsibilities and data dependencies, not measured time.</desc><defs><marker id="315C9A" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#315C9A"/></marker><marker id="087F8C" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#087F8C"/></marker><marker id="7462A3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#7462A3"/></marker><marker id="536578" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#536578"/></marker><marker id="A9632B" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#A9632B"/></marker></defs><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><rect x="0" y="0" width="1000" height="1200" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28" y="43" font-size="31" fill="#16324F" font-weight="700" text-anchor="start">一幀進來，分成偵測與運動兩條資料路徑</text>
<text x="28" y="82" font-size="22" fill="#536578" font-weight="400" text-anchor="start">JPEG 主線・HR 1280×768・G1 NVOFA・CUDA Graph ON；按箭頭讀資料交接。</text>
<rect x="40" y="112" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#536578" stroke-width="1.5"/>
<text x="56" y="144" font-size="24" fill="#536578" font-weight="700" text-anchor="start">CPU：讀取 JPEG</text>
<text x="56" y="174" font-size="20" fill="#536578" font-weight="400" text-anchor="start">壓縮 bytes</text>
<text x="56" y="203" font-size="20" fill="#536578" font-weight="400" text-anchor="start">pinned staging</text>
<rect x="335" y="112" width="285" height="100" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="351" y="144" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">F01：nvJPEG 解碼</text>
<text x="351" y="174" font-size="20" fill="#536578" font-weight="400" text-anchor="start">GPU hardware backend</text>
<text x="351" y="203" font-size="20" fill="#536578" font-weight="400" text-anchor="start">另有色彩轉換工作</text>
<rect x="665" y="112" width="295" height="100" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="681" y="144" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">GPU：原圖 RGB8</text>
<text x="681" y="174" font-size="20" fill="#536578" font-weight="400" text-anchor="start">planar R／G／B</text>
<text x="681" y="203" font-size="20" fill="#536578" font-weight="400" text-anchor="start">F02 與 F05 共用讀取</text>
<path d="M292,162 L331,162" stroke="#536578" stroke-width="2" fill="none" marker-end="url(#536578)"/>
<path d="M622,162 L661,162" stroke="#315C9A" stroke-width="2" fill="none" marker-end="url(#315C9A)"/>
<path d="M28,270 H972 V560 H510 V690 H28 Z" fill="#EFF4FB" stroke="#DCE4EA" stroke-width="1.5"/>
<rect x="530" y="560" width="442" height="130" rx="12" fill="#EDF8F7" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="45" y="304" font-size="25" fill="#315C9A" font-weight="700" text-anchor="start">D：偵測與灰階</text>
<path d="M812,212 V248 H240 V330" stroke="#315C9A" stroke-width="2.3" fill="none" marker-end="url(#315C9A)"/>
<path d="M812,248 V330" stroke="#315C9A" stroke-width="2.3" fill="none" marker-end="url(#315C9A)"/>
<text x="478" y="249" font-size="21" fill="#536578" font-weight="400" text-anchor="middle">同一張原圖，兩種用途</text>
<rect x="50" y="330" width="400" height="95" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="66" y="362" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">F02：模型 images</text>
<text x="66" y="392" font-size="21" fill="#536578" font-weight="400" text-anchor="start">FP32 NCHW 1×3×768×1280</text>
<text x="66" y="421" font-size="21" fill="#536578" font-weight="400" text-anchor="start">正規化＋antialiased stretch</text>
<rect x="550" y="330" width="400" height="95" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="566" y="362" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">F05：運動影像 MI</text>
<text x="566" y="392" font-size="21" fill="#536578" font-weight="400" text-anchor="start">由原圖 RGB 取灰階／縮小</text>
<text x="566" y="421" font-size="21" fill="#536578" font-weight="400" text-anchor="start">獨立 MI slot；不是模型 tensor</text>
<path d="M250,427 L250,448" stroke="#315C9A" stroke-width="2" fill="none" marker-end="url(#315C9A)"/>
<path d="M750,427 L750,448" stroke="#315C9A" stroke-width="2" fill="none" marker-end="url(#315C9A)"/>
<rect x="50" y="450" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="66" y="482" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">D Graph：偵測與檢查</text>
<text x="66" y="512" font-size="21" fill="#536578" font-weight="400" text-anchor="start">F03 → producer → F04</text>
<text x="66" y="541" font-size="21" fill="#536578" font-weight="400" text-anchor="start">6 raw outputs／finite／9 statuses</text>
<rect x="550" y="450" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="566" y="482" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">MI ready → G1 可先開始</text>
<text x="566" y="512" font-size="21" fill="#536578" font-weight="400" text-anchor="start">M 等待 mi_ready</text>
<text x="566" y="541" font-size="21" fill="#536578" font-weight="400" text-anchor="start">F03 仍可在 D 上計算</text>
<path d="M250,552 L250,573" stroke="#315C9A" stroke-width="2" fill="none" marker-end="url(#315C9A)"/>
<path d="M750,552 L750,573" stroke="#087F8C" stroke-width="2" fill="none" marker-end="url(#087F8C)"/>
<rect x="50" y="575" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#315C9A" stroke-width="1.5"/>
<text x="66" y="607" font-size="24" fill="#315C9A" font-weight="700" text-anchor="start">CS：本幀 candidates</text>
<text x="66" y="637" font-size="21" fill="#536578" font-weight="400" text-anchor="start">kept ＋ suppressed</text>
<text x="66" y="666" font-size="21" fill="#536578" font-weight="400" text-anchor="start">candidates_ready 交給 M</text>
<rect x="550" y="575" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="566" y="607" font-size="24" fill="#087F8C" font-weight="700" text-anchor="start">M：F06／G1 → MotionContext</text>
<text x="566" y="637" font-size="20" fill="#536578" font-weight="400" text-anchor="start">上一 committed gray／mask ＋ MI</text>
<text x="566" y="666" font-size="20" fill="#536578" font-weight="400" text-anchor="start">NVOFA → cells → 分量中位數</text>
<rect x="28" y="720" width="944" height="180" rx="12" fill="#EDF8F7" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="45" y="748" font-size="23" fill="#087F8C" font-weight="700" text-anchor="start">M：先估運動，再依同幀候選接續 ID（此列由右往左）</text>
<path d="M750,675 V696 H825 V766" stroke="#087F8C" stroke-width="2.3" fill="none" marker-end="url(#087F8C)"/>
<path d="M250,675 V706 H500 V766" stroke="#315C9A" stroke-width="2.3" fill="none" marker-end="url(#315C9A)"/>
<rect x="690" y="770" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="706" y="802" font-size="24" fill="#087F8C" font-weight="700" text-anchor="start">F08a：本幀 prior</text>
<text x="706" y="832" font-size="20" fill="#536578" font-weight="400" text-anchor="start">GMC＋一次 Kalman</text>
<text x="706" y="861" font-size="20" fill="#536578" font-weight="400" text-anchor="start">讀 committed TrackState</text>
<rect x="370" y="770" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="386" y="802" font-size="24" fill="#087F8C" font-weight="700" text-anchor="start">等候 CS → current mask</text>
<text x="386" y="832" font-size="18" fill="#536578" font-weight="400" text-anchor="start">kept person，score ≥ 0.45</text>
<text x="386" y="861" font-size="18" fill="#536578" font-weight="400" text-anchor="start">working mask 供下一幀用</text>
<rect x="50" y="770" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="66" y="802" font-size="24" fill="#087F8C" font-weight="700" text-anchor="start">M Graph：追蹤提交</text>
<text x="66" y="832" font-size="20" fill="#536578" font-weight="400" text-anchor="start">F04b → 關聯／update</text>
<text x="66" y="861" font-size="20" fill="#536578" font-weight="400" text-anchor="start">commit → 固定 packet</text>
<path d="M687,825 L633,825" stroke="#087F8C" stroke-width="2" fill="none" marker-end="url(#087F8C)"/>
<path d="M367,825 L313,825" stroke="#087F8C" stroke-width="2" fill="none" marker-end="url(#087F8C)"/>
<path d="M180,882 L180,933" stroke="#087F8C" stroke-width="2" fill="none" marker-end="url(#087F8C)"/>
<rect x="50" y="935" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#087F8C" stroke-width="1.5"/>
<text x="66" y="967" font-size="24" fill="#087F8C" font-weight="700" text-anchor="start">M：依序兩次 D2H</text>
<text x="66" y="997" font-size="21" fill="#536578" font-weight="400" text-anchor="start">MotionContext 56 B</text>
<text x="66" y="1026" font-size="21" fill="#536578" font-weight="400" text-anchor="start">ResultPacket 12,368 B</text>
<rect x="550" y="935" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#536578" stroke-width="1.5"/>
<text x="566" y="967" font-size="24" fill="#536578" font-weight="700" text-anchor="start">CPU：receive → F09</text>
<text x="566" y="997" font-size="20" fill="#536578" font-weight="400" text-anchor="start">驗證／複製成 owned result</text>
<text x="566" y="1026" font-size="20" fill="#536578" font-weight="400" text-anchor="start">JPEG 序列尾插值、ID 定稿、MOT</text>
<path d="M452,985 L547,985" stroke="#536578" stroke-width="2" fill="none" marker-end="url(#536578)"/>
<rect x="50" y="1080" width="900" height="82" rx="11" fill="#F3F0FA" stroke="#7462A3" stroke-width="1.5"/>
<text x="70" y="1110" font-size="25" fill="#7462A3" font-weight="700" text-anchor="start">跨幀回饋：TrackState ＋ gray ＋ mask</text>
<text x="70" y="1143" font-size="21" fill="#536578" font-weight="400" text-anchor="start">成功 commit 才發布共同版本；gray／mask 回到 G1，TrackState 回到 predict。</text>
<path d="M180,900 H15 V1120 H47" stroke="#7462A3" stroke-width="2.2" fill="none" stroke-dasharray="6 5" marker-end="url(#7462A3)"/>
<path d="M951,1120 H986 V625 H953" stroke="#7462A3" stroke-width="2.2" fill="none" stroke-dasharray="6 5" marker-end="url(#7462A3)"/>
<path d="M986,825 H953" stroke="#7462A3" stroke-width="2.2" fill="none" stroke-dasharray="6 5" marker-end="url(#7462A3)"/>
<text x="28" y="1191" font-size="20" fill="#536578" font-weight="400" text-anchor="start">實線＝資料／必要次序；虛線＝上一已提交版本的回饋。色塊和箭頭不表示時間比例。</text></g></svg>

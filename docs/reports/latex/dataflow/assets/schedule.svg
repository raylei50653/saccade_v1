<text x="652.500" y="195.000" font-size="23" fill="#FFFFFF" font-weight="600" text-anchor="middle">下一幀偵測路徑 n+1</text>
<path d="M475,211 V230 H500 V242" stroke="#536578" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<text x="230.000" y="268.000" font-size="21" fill="#536578" font-weight="400" text-anchor="start">等候候選 ready</text>
<rect x="500.000" y="242.000" width="168.000" height="45.000" fill="#087F8C" stroke="none" rx="7" opacity="1"/>
<text x="584.000" y="272.000" font-size="22" fill="#FFFFFF" font-weight="600" text-anchor="middle">關聯／提交 n</text>
<path d="M675.000,264.000 L811.000,264.000" stroke="#087F8C" stroke-width="2.5" fill="none" stroke-dasharray="5 4"/>
<path d="M801.9955289764732,268.3496553411123 L811,264 L801.9955289764732,259.6503446588877" stroke="#087F8C" stroke-width="2.5" fill="none"/>
<text x="744.000" y="246.000" font-size="18" fill="#087F8C" font-weight="400" text-anchor="middle">commit(n) 後</text>
<rect x="820.000" y="242.000" width="140.000" height="45.000" fill="#087F8C" stroke="none" rx="7" opacity="1"/>
<text x="890.000" y="272.000" font-size="21" fill="#FFFFFF" font-weight="600" text-anchor="middle">追蹤 n+1</text>
<text x="48.000" y="323.000" font-size="23" fill="#203247" font-weight="400" text-anchor="start">可重疊的工作往前做；同一份狀態不能跨越前幀的 commit。</text>
<text x="48.000" y="350.000" font-size="20" fill="#536578" font-weight="400" text-anchor="start">slot 以 ready／consumed 交接：最後讀取完成才重用，結果滿時背壓。</text>
<text x="28.000" y="410.000" font-size="26" fill="#16324F" font-weight="700" text-anchor="start">Nsight 實測：第 21–23 幀</text>
<text x="28.000" y="447.000" font-size="21" fill="#536578" font-weight="400" text-anchor="start">同幀 F03 偵測與 G1 運動估計也可重疊；下列為階段起訖區間。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc"><title id="title">n／n+1：把能重疊的工作接起來</title><desc id="desc">上半為依賴示意，下半為歷史 G1 Nsight trace 的三個相鄰影格階段區間。</desc><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><rect x="0.000" y="0.000" width="1000.000" height="930.000" fill="#FFFFFF" stroke="none" rx="0" opacity="1"/>
<text x="28.000" y="43.000" font-size="31" fill="#16324F" font-weight="700" text-anchor="start">n／n+1：把能重疊的工作接起來</text>
<text x="28.000" y="84.000" font-size="23" fill="#536578" font-weight="400" text-anchor="start">D 偵測路徑可往下一幀前進；M 的身份狀態仍依幀順序提交。</text>
<rect x="28.000" y="108.000" width="944.000" height="256.000" fill="#F5F8FA" stroke="#DCE4EA" rx="10" opacity="1"/>
<text x="48.000" y="143.000" font-size="24" fill="#16324F" font-weight="700" text-anchor="start">依賴示意</text>
<text x="952.000" y="143.000" font-size="21" fill="#536578" font-weight="400" text-anchor="end">框寬不是時間</text>
<text x="48.000" y="196.000" font-size="23" fill="#16324F" font-weight="700" text-anchor="start">D 偵測</text>
<text x="48.000" y="267.000" font-size="23" fill="#087F8C" font-weight="700" text-anchor="start">M 追蹤</text>

<text x="28.000" y="839.000" font-size="21" fill="#536578" font-weight="400" text-anchor="start">來源：2026-11-05／乾淨 fae5cb7／G1；原 trace 30 幀，取相鄰三幀。</text>
<text x="28.000" y="874.000" font-size="21" fill="#536578" font-weight="400" text-anchor="start">OFA 本體未被直接觀察；此圖用既有 CUDA 活動重建，沒有新跑 GPU。</text>
<text x="28.000" y="909.000" font-size="21" fill="#536578" font-weight="400" text-anchor="start">Profiler 會影響時間；這些區間不取代無 profiler 的產品延遲與吞吐。</text></g></svg>

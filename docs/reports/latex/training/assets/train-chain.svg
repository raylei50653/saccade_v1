<text x="28.0" y="580.0" font-size="18" fill="#203247" font-weight="400" text-anchor="start">資料：MOT17 五段訓練序列＋MOTSynth 合成影片（①、④）；③ 只讀 ② 的 MOT17 cache；④ 從 ③ 的選定權重接續。</text>
<text x="28.0" y="608.0" font-size="17" fill="#536578" font-weight="400" text-anchor="start">百分比為 MOT17-10 val AP50（選模用的開發分數）；時間為單次正式 run 的牆鐘時間。部署 head 只看單一影格（T=1）。</text></g></svg>

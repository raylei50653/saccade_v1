<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">部署模型的兩半，各從哪個訓練階段來</title><desc id="desc">四個訓練階段的順序、各階段學什麼、選定 checkpoint 的 MOT17-10 val AP50，以及部署模型的 backbone 與 head 各來自哪一階段。</desc><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><rect x="0.0" y="0.0" width="1000.0" height="640.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="31" fill="#16324F" font-weight="700" text-anchor="start">部署模型的兩半，各從哪個訓練階段來</text>
<text x="28.0" y="80.0" font-size="22" fill="#536578" font-weight="400" text-anchor="start">先把整個 YOLO26m 調成會找行人，再讓新的 Mamba head 模仿它，最後用標註答案修正。</text>

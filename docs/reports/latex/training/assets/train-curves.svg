<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">為什麼不直接用最後一輪</title><desc id="desc">左：UA2 Teacher 每輪 val AP50，EMA 權重與原始權重；右：學生 GT1 加入 MOTSynth 與只用 MOT17 的每輪 val AP50。圓圈為選定 epoch。</desc><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><rect x="0.0" y="0.0" width="1000.0" height="560.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="31" fill="#16324F" font-weight="700" text-anchor="start">為什麼不直接用最後一輪？</text>
<text x="28.0" y="80.0" font-size="22" fill="#536578" font-weight="400" text-anchor="start">每輪都在 MOT17-10 驗證；分數通常先升後降，所以依規則挑最佳一輪並提早停止。</text>

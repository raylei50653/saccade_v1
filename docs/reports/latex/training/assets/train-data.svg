<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">誰拿來訓練、誰拿來選、誰留到最後</title><desc id="desc">MOT17 七段依幀數比例分成訓練、選模與保留評估；MOTSynth 合成影片作為額外訓練資料；所有影像使用同一輸入前處理。</desc><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif"><rect x="0.0" y="0.0" width="1000.0" height="640.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="42.0" font-size="31" fill="#16324F" font-weight="700" text-anchor="start">誰拿來訓練、誰拿來選、誰留到最後</text>
<text x="28.0" y="80.0" font-size="22" fill="#536578" font-weight="400" text-anchor="start">以「整段序列」為單位隔離：選模與最終評估的每一幀都沒有進入任何訓練階段。</text>
<text x="28.0" y="122.0" font-size="22" fill="#16324F" font-weight="700" text-anchor="start">MOT17（真實街景，七段、5,316 幀；方塊寬度＝幀數）</text>
<rect x="29.0" y="136.0" width="104.5" height="62.0" rx="5" fill="#9AAABD" stroke="none" stroke-width="1.5"/>
<text x="81.3" y="166.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-02</text>
<text x="81.3" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">600 幀</text>
<rect x="135.5" y="136.0" width="184.5" height="62.0" rx="5" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="227.8" y="166.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-04</text>
<text x="227.8" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">1,050 幀</text>
<rect x="322.0" y="136.0" width="146.6" height="62.0" rx="5" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="395.3" y="166.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-05</text>
<text x="395.3" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">837 幀</text>
<rect x="470.6" y="136.0" width="91.2" height="62.0" rx="5" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="516.2" y="166.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-09</text>
<text x="516.2" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">525 幀</text>
<rect x="563.9" y="136.0" width="114.1" height="62.0" rx="5" fill="#BB6A2B" stroke="none" stroke-width="1.5"/>
<text x="620.9" y="166.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-10</text>
<text x="620.9" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">654 幀</text>
<rect x="680.0" y="136.0" width="157.8" height="62.0" rx="5" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="758.9" y="166.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-11</text>
<text x="758.9" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">900 幀</text>
<rect x="839.8" y="136.0" width="131.2" height="62.0" rx="5" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="905.4" y="166.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">MOT17-13</text>
<text x="905.4" y="189.0" font-size="16" fill="#FFFFFF" font-weight="400" text-anchor="middle">750 幀</text>
<rect x="28.0" y="219.0" width="22.0" height="18.0" rx="3" fill="#087F8C" stroke="none" stroke-width="1.5"/>
<text x="60.0" y="236.0" font-size="21" fill="#087F8C" font-weight="700" text-anchor="start">訓練</text>
<text x="160.0" y="236.0" font-size="20" fill="#203247" font-weight="400" text-anchor="start">04／05／09／11／13：4,062 幀、73,762 個框</text>
<rect x="28.0" y="253.0" width="22.0" height="18.0" rx="3" fill="#BB6A2B" stroke="none" stroke-width="1.5"/>
<text x="60.0" y="270.0" font-size="21" fill="#BB6A2B" font-weight="700" text-anchor="start">選模</text>
<text x="160.0" y="270.0" font-size="20" fill="#203247" font-weight="400" text-anchor="start">10：654 幀、11,117 個框（移動鏡頭、夜間）</text>
<rect x="28.0" y="287.0" width="22.0" height="18.0" rx="3" fill="#9AAABD" stroke="none" stroke-width="1.5"/>
<text x="60.0" y="304.0" font-size="21" fill="#536578" font-weight="700" text-anchor="start">最後才開</text>
<text x="160.0" y="304.0" font-size="20" fill="#203247" font-weight="400" text-anchor="start">02：600 幀、10,993 個框（固定鏡頭、白天）</text>
<rect x="28.0" y="350.0" width="944.0" height="124.0" rx="10" fill="#FBF3EC" stroke="#E8D3BF" stroke-width="1.5"/>
<text x="48.0" y="384.0" font-size="22" fill="#BB6A2B" font-weight="700" text-anchor="start">MOTSynth（遊戲引擎合成的街景行人）</text>
<text x="48.0" y="416.0" font-size="20" fill="#203247" font-weight="400" text-anchor="start">764 支 1080p 影片 → NVDEC 解碼、每 20 幀取 1 → 68,760 張 JPEG；與 MOT17 同一套標註篩選。</text>
<text x="48.0" y="448.0" font-size="20" fill="#203247" font-weight="400" text-anchor="start">Teacher：每個 MOT17 批次後接一個 MOTSynth 批次（1:1）；學生 GT1：每次更新 12＋4 張（3:1）。</text>
<text x="28.0" y="512.0" font-size="22" fill="#16324F" font-weight="700" text-anchor="start">所有影像同一條前處理（訓練、cache、選模、匯出參考共用；部署 F01／F02 實作同一規則）</text>
<rect x="28.0" y="530.0" width="168.0" height="54.0" rx="8" fill="#F3F6F9" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="112.0" y="564.0" font-size="19" fill="#16324F" font-weight="600" text-anchor="middle">JPEG</text>
<path d="M198.0,557.0 L211.0,557.0" fill="none" stroke="#16324F" stroke-width="3"/>
<path d="M205.0,550.0 L217.0,557.0 L205.0,564.0" fill="none" stroke="#16324F" stroke-width="3"/>
<rect x="220.0" y="530.0" width="168.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="304.0" y="564.0" font-size="19" fill="#16324F" font-weight="600" text-anchor="middle">nvJPEG 解成 RGB</text>
<path d="M390.0,557.0 L403.0,557.0" fill="none" stroke="#16324F" stroke-width="3"/>
<path d="M397.0,550.0 L409.0,557.0 L397.0,564.0" fill="none" stroke="#16324F" stroke-width="3"/>
<rect x="412.0" y="530.0" width="168.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="496.0" y="564.0" font-size="19" fill="#16324F" font-weight="600" text-anchor="middle">÷255 轉 float32</text>
<path d="M582.0,557.0 L595.0,557.0" fill="none" stroke="#16324F" stroke-width="3"/>
<path d="M589.0,550.0 L601.0,557.0 L589.0,564.0" fill="none" stroke="#16324F" stroke-width="3"/>
<rect x="604.0" y="530.0" width="168.0" height="54.0" rx="8" fill="#FFFFFF" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="688.0" y="564.0" font-size="19" fill="#16324F" font-weight="600" text-anchor="middle">抗鋸齒雙線性</text>
<path d="M774.0,557.0 L787.0,557.0" fill="none" stroke="#16324F" stroke-width="3"/>
<path d="M781.0,550.0 L793.0,557.0 L781.0,564.0" fill="none" stroke="#16324F" stroke-width="3"/>
<rect x="796.0" y="530.0" width="168.0" height="54.0" rx="8" fill="#F3F6F9" stroke="#DCE4EA" stroke-width="1.5"/>
<text x="880.0" y="564.0" font-size="19" fill="#16324F" font-weight="600" text-anchor="middle">1280×768 輸入</text>
<text x="28.0" y="618.0" font-size="18" fill="#536578" font-weight="400" text-anchor="start">直接拉伸（stretch），不補灰邊；不取整、不做 mean／std 正規化。前處理只要差一點，特徵就會差好幾個百分比。</text></g></svg>
